name: ci
on: [push, pull_request]

jobs:
  test:
    name: tests and demo (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite (stdlib only)
        run: python tests/run_all.py
      - name: Offline demo
        run: python -m iolite demo

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check iolite tests

  onyx-compat:
    name: ONYX compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NizarJasim1/Onyx
          path: onyx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test suite with ONYX available
        run: ONYX_PATH="$GITHUB_WORKSPACE/onyx" python tests/run_all.py
